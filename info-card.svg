<svg xmlns="http://www.w3.org/2000/svg"
    width="490"
    height="470"
    viewBox="0 0 490 470">

    <rect width="100%" height="100%"
        rx="12"
        fill="#0d1117"
        stroke="#30363d"
        stroke-width="1"/>

    <style>
        .title {
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            fill: #58a6ff;
        }

        .key {
            font-family: monospace;
            font-size: 14px;
            fill: #8b949e;
        }

        .value {
            font-family: monospace;
            font-size: 14px;
            fill: #c9d1d9;
        }

        .prompt {
            font-family: monospace;
            font-size: 13px;
            fill: #7ee787;
        }

        .line {
            opacity: 0;
            animation: appear 0.45s ease-out forwards;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

    <text x="25" y="35" class="prompt">
        abhinav@github:~$
    </text>

    <text x="175" y="35" class="title">
        whoami
    </text>

    <line x1="25" y1="52" x2="465" y2="52"
        stroke="#30363d"/>


    <g class="line"
       style="animation-delay:0.00s">

        <text x="25" y="90" class="key">
            Name      
        </text>

        <text x="125" y="90" class="value">
            Abhinav Sabu
        </text>

    </g>

    <g class="line"
       style="animation-delay:0.12s">

        <text x="25" y="135" class="key">
            Focus     
        </text>

        <text x="125" y="135" class="value">
            Cybersecurity
        </text>

    </g>

    <g class="line"
       style="animation-delay:0.24s">

        <text x="25" y="180" class="key">
            Stack     
        </text>

        <text x="125" y="180" class="value">
            Python • Linux • Networking
        </text>

    </g>

    <g class="line"
       style="animation-delay:0.36s">

        <text x="25" y="225" class="key">
            Tools     
        </text>

        <text x="125" y="225" class="value">
            Nmap • Wireshark • Git
        </text>

    </g>

    <g class="line"
       style="animation-delay:0.48s">

        <text x="25" y="270" class="key">
            Labs      
        </text>

        <text x="125" y="270" class="value">
            TryHackMe • OverTheWire
        </text>

    </g>

    <g class="line"
       style="animation-delay:0.60s">

        <text x="25" y="315" class="key">
            Learning  
        </text>

        <text x="125" y="315" class="value">
            OSINT • Web Security
        </text>

    </g>

    <g class="line"
       style="animation-delay:0.72s">

        <text x="25" y="360" class="key">
            Currently 
        </text>

        <text x="125" y="360" class="value">
            Cybersecurity Journey
        </text>

    </g>

    <line x1="25" y1="420" x2="465" y2="420"
        stroke="#30363d"/>

    <text x="25" y="450" class="prompt">
        abhinav@github:~$ _
    </text>

</svg>
