<style>

.ascii {
    font-family: "Courier New", monospace;
    font-size: 8px;
    font-weight: 400;
    fill: #c9d1d9;
}

.row {
    opacity: 0;
    animation:
        typeRow 0.28s ease-out forwards;
}

@keyframes typeRow {

    from {
        opacity: 0;
        transform:
            translateX(-12px);
    }

    to {
        opacity: 1;
        transform:
            translateX(0);
    }

}

</style>

